name: Update manifest

on:
  repository_dispatch:
    types: [new-release]

jobs:
  update:
    name: Update tunnel-agent manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Update manifest
        env:
          VERSION: ${{ github.event.client_payload.version }}
          URL:     ${{ github.event.client_payload.url }}
          SHA256:  ${{ github.event.client_payload.sha256 }}
        run: |
          jq \
            --arg version "$VERSION" \
            --arg url     "$URL" \
            --arg sha256  "$SHA256" \
            '
              .version = $version |
              .architecture["64bit"].url  = $url |
              .architecture["64bit"].hash = $sha256 |
              .autoupdate.architecture["64bit"].url =
                "https://github.com/Villoh/tunnel-agent/releases/download/v$version/TunnelAgent-$version-win-x64-scoop.zip" |
              .autoupdate.architecture["64bit"].hash.jsonpath =
                "$.platforms.win-x64.scoop.sha256"
            ' \
            bucket/tunnel-agent.json > /tmp/manifest.json
          mv /tmp/manifest.json bucket/tunnel-agent.json
          echo "Updated to $VERSION"
          cat bucket/tunnel-agent.json

      - name: Commit and push
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/tunnel-agent.json
          git commit -m "chore: update tunnel-agent to $VERSION"
          git push
