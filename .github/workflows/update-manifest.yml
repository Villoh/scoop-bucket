name: Update Manifest

on:
  repository_dispatch:
    types: [new-release]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update tunnel-agent manifest
        env:
          VERSION: ${{ github.event.client_payload.version }}
          URL: ${{ github.event.client_payload.url }}
          SHA256: ${{ github.event.client_payload.sha256 }}
        run: |
          jq \
            --arg version "$VERSION" \
            --arg url "$URL" \
            --arg hash "$SHA256" \
            '.version = $version |
             .architecture["64bit"].url = $url |
             .architecture["64bit"].hash = $hash |
             .autoupdate.architecture["64bit"].url = ("https://github.com/Villoh/tunnel-agent/releases/download/v" + $version + "/TunnelAgent-" + $version + "-win-Setup.exe")' \
            bucket/tunnel-agent.json > tmp.json
          mv tmp.json bucket/tunnel-agent.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/tunnel-agent.json
          git commit -m "chore: update tunnel-agent to v${{ github.event.client_payload.version }}"
          git push
